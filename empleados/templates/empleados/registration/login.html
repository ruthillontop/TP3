{% extends "base.html" %}

{% block content %}
<h2>Iniciar sesión</h2>

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Ingresar</button>
</form>

{% if form.errors %}
  <p style="color: red;">Usuario o contraseña incorrectos</p>
{% endif %}


{% block extra %}
    <p>
        ¿No tienes una cuenta? <a href="{% url 'register' %}">Regístrate aquí</a>.
    </p>
{% endblock %}
